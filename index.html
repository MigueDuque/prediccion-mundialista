const names = Object.keys(TEAMS);
const mean = (a) => a.reduce((s, x) => s + x, 0) / a.length;
const std = (a) => { const m = mean(a); return Math.sqrt(mean(a.map((x) => (x - m) ** 2))); };
const zmap = (vals) => { const m = mean(vals), s = std(vals); return (x) => (x - m) / s; };
const zMV = zmap(names.map((n) => Math.log(TEAMS[n].mv)));
const zLg = zmap(names.map((n) => TEAMS[n].league));
const zH  = zmap(names.map((n) => TEAMS[n].h));
const zE  = zmap(names.map((n) => Math.log(TEAMS[n].wc)));
const Z = {};
names.forEach((n) => {
  Z[n] = { mv:zMV(Math.log(TEAMS[n].mv)), league:zLg(TEAMS[n].league), height:zH(TEAMS[n].h), exp:zE(Math.log(TEAMS[n].wc)) };
});

function effective(name, w) {
  const t = TEAMS[name];
  return t.elo + w.mv*Z[name].mv*40 + w.league*Z[name].league*25 + w.form*t.form*6
    + w.height*Z[name].height*12 + w.exp*Z[name].exp*12;
}
const altPen = (name, venue) => Math.min(venue.alt/2240, 1) * (1 - TEAMS[name].altTol);
const heatPen = (name, venue) => venue.heat * (1 - TEAMS[name].heatTol);
const altPts = (name, venue, w) => w.alt * altPen(name, venue) * 60;
const heatPts = (name, venue, w) => w.heat * heatPen(name, venue) * 50;

const fact = (k) => (k <= 1 ? 1 : k * fact(k - 1));
const pois = (k, l) => (Math.exp(-l) * l ** k) / fact(k);
const RHO = -0.08;
function tau(x, y, la, lb) {
  if (x === 0 && y === 0) return 1 - la * lb * RHO;
  if (x === 0 && y === 1) return 1 + la * RHO;
  if (x === 1 && y === 0) return 1 + lb * RHO;
  if (x === 1 && y === 1) return 1 - RHO;
  return 1;
}

function predict(a, b, w, homeTeam, venue) {
  const MAXG = 8;
  const v = venue || VENUES["Neutral"];
  let rA = effective(a, w) - altPts(a, v, w) - heatPts(a, v, w);
  let rB = effective(b, w) - altPts(b, v, w) - heatPts(b, v, w);
  let dR = rA - rB;
  if (homeTeam === a) dR += w.host;
  if (homeTeam === b) dR -= w.host;
  let s = Math.max(-2.8, Math.min(2.8, dR / 180));
  const openness = TEAMS[a].gf + TEAMS[b].gf;
  let mu = 2.5 + w.goals * 1.6 * openness + 0.45 * Math.abs(s);
  mu = Math.max(1.6, Math.min(4.2, mu));
  const la = Math.max(0.18, mu / 2 + s / 2);
  const lb = Math.max(0.18, mu / 2 - s / 2);
  let pA = 0, pD = 0, pB = 0, total = 0, o15 = 0, o25 = 0, o35 = 0, btts = 0;
  const grid = [];
  for (let i = 0; i <= MAXG; i++)
    for (let j = 0; j <= MAXG; j++) {
      const p = pois(i, la) * pois(j, lb) * tau(i, j, la, lb);
      total += p; grid.push({ i, j, p });
    }
  grid.forEach((c) => {
    c.p /= total;
    if (c.i > c.j) pA += c.p; else if (c.i === c.j) pD += c.p; else pB += c.p;
    if (c.i + c.j > 1) o15 += c.p;
    if (c.i + c.j > 2) o25 += c.p;
    if (c.i + c.j > 3) o35 += c.p;
    if (c.i >= 1 && c.j >= 1) btts += c.p;
  });
  grid.sort((x, y) => y.p - x.p);
  return { pA, pD, pB, la, lb, top: grid.slice(0, 4), dR, o15, o25, o35, btts };
}

const pct = (x) => Math.round(x * 100);
const odd = (x) => (x > 0.0001 ? (1 / x).toFixed(2) : "—");
const groups = [..."ABCDEFGHIJKL"];
const debut = (n) => TEAMS[n].wc <= 1;

function confidence(r) {
  const top = Math.max(r.pA, r.pB);
  if (top >= 0.7) return { label: "Muy alta", c: "#7ee0a8" };
  if (top >= 0.55) return { label: "Alta", c: "#bfe07e" };
  if (top >= 0.45) return { label: "Media", c: "#e0cf7e" };
  return { label: "Pareja", c: "#e09a7e" };
}

const C = { bg:"#0a0e14", panel:"#121821", line:"#1e2733", ink:"#e8eaed", muted:"#8a94a6", A:"#46d1c4", B:"#f0a23b", D:"#566072" };

function Bar({ r, a, b }) {
  const seg = [{ w:r.pA, c:C.A }, { w:r.pD, c:C.D }, { w:r.pB, c:C.B }];
  return (
    <div>
      <div className="flex justify-between text-xs mb-2" style={{ color:C.muted }}>
        <span style={{ color:C.A }}>{a} · {pct(r.pA)}%</span>
        <span>Empate · {pct(r.pD)}%</span>
        <span style={{ color:C.B }}>{b} · {pct(r.pB)}%</span>
      </div>
      <div className="flex h-9 w-full overflow-hidden rounded" style={{ border:`1px solid ${C.line}` }}>
        {seg.map((s, k) => <div key={k} style={{ width:`${s.w*100}%`, background:s.c, transition:"width .35s ease" }} />)}
      </div>
    </div>
  );
}

function LineRow({ label, p }) {
  return (
    <div className="flex items-center justify-between py-1 text-sm font-mono" style={{ borderTop:`1px solid ${C.line}` }}>

      <span style={{ color:C.ink }}>{pct(p)}% <span style={{ color:C.muted }}>· justa {odd(p)}</span></span>
    </div>
  );
}

function MatchCard({ fx, w }) {
  const v = fx.venue ? VENUES[fx.venue] : VENUES["Neutral"];
  const r = predict(fx.a, fx.b, w, fx.home, v);
  const conf = confidence(r);
  const winner = r.pA >= r.pB ? fx.a : fx.b;
  const sc = r.top[0];
  return (
    <div className="p-4 rounded-lg" style={{ background:C.panel, border:`1px solid ${C.line}` }}>
      <div className="flex items-center justify-between mb-3">
        <span className="text-xs font-mono px-1.5 py-0.5 rounded" style={{ color:C.muted, border:`1px solid ${C.line}` }}>GRUPO {fx.g}</span>
        {fx.result
          ? <span className="text-xs font-mono" style={{ color:"#7ee0a8" }}>REAL {fx.result[0]}–{fx.result[1]}</span>
          : <span className="text-xs font-mono" style={{ color:conf.c }}>{conf.label}</span>}
      </div>
      <div className="flex items-baseline justify-between mb-1">
        <span style={{ color:r.pA >= r.pB ? C.ink : C.muted }} className="font-medium">{fx.a}{debut(fx.a) && <span style={{color:C.muted}} className="text-xs"> ·deb</span>}</span>
        <span className="font-mono text-lg" style={{ color:C.ink }}>{sc.i}–{sc.j}</span>
        <span style={{ color:r.pB > r.pA ? C.ink : C.muted }} className="font-medium text-right">{fx.b}{debut(fx.b) && <span style={{color:C.muted}} className="text-xs"> ·deb</span>}</span>
      </div>
      <div className="mt-3"><Bar r={r} a={fx.a} b={fx.b} /></div>
      <div className="mt-3 grid grid-cols-2 gap-x-4">
        <LineRow label="Más 2.5 goles" p={r.o25} />
        <LineRow label="Ambos marcan" p={r.btts} />
      </div>
      <div className="mt-2 text-xs" style={{ color:C.muted }}>
        Pick: <span style={{ color:C.ink }}>{winner}</span> · {pct(Math.max(r.pA,r.pB))}%
        {fx.venue && <span> · {fx.venue}</span>}
      </div>
    </div>
  );
}

function Detail({ a, b, w, home, venueName }) {
  const v = VENUES[venueName] || VENUES["Neutral"];
  const r = predict(a, b, w, home, v);
  const conf = confidence(r);
  const winner = r.pA >= r.pB ? a : b;
  const ctxOn = v.alt > 0 || v.heat > 0;
  const rows = [
    ["Elo (15-jun-26)", Math.round(TEAMS[a].elo), Math.round(TEAMS[b].elo)],
    ["Valor plantilla (€M)", TEAMS[a].mv, TEAMS[b].mv],
    ["Ligas top-5", TEAMS[a].league.toFixed(2), TEAMS[b].league.toFixed(2)],
    ["Forma (últ. 5)", TEAMS[a].form>0?"+"+TEAMS[a].form:TEAMS[a].form, TEAMS[b].form>0?"+"+TEAMS[b].form:TEAMS[b].form],
    ["Altura media (cm)", TEAMS[a].h.toFixed(1), TEAMS[b].h.toFixed(1)],
    ["Mundiales (incl. 26)", TEAMS[a].wc, TEAMS[b].wc],
  ];
  if (ctxOn) {
    rows.push(["↳ Pérdida altitud", "−"+Math.round(altPts(a,v,w)), "−"+Math.round(altPts(b,v,w))]);
    rows.push(["↳ Pérdida calor", "−"+Math.round(heatPts(a,v,w)), "−"+Math.round(heatPts(b,v,w))]);
  }
  rows.push(["Rating efectivo", Math.round(effective(a,w)-altPts(a,v,w)-heatPts(a,v,w)), Math.round(effective(b,w)-altPts(b,v,w)-heatPts(b,v,w))]);

  return (
    <div className="p-5 rounded-lg" style={{ background:C.panel, border:`1px solid ${C.line}` }}>
      <div className="flex items-center justify-between mb-4">
        <h3 className="font-semibold" style={{ color:C.ink }}>{a} <span style={{ color:C.muted }}>vs</span> {b}</h3>
        <span className="text-xs font-mono" style={{ color:conf.c }}>{conf.label}</span>
      </div>
      <Bar r={r} a={a} b={b} />
      <div className="flex items-center justify-center gap-6 my-5">
        <div className="text-center">
          <div className="text-xs" style={{ color:C.muted }}>Marcador más probable</div>
          <div className="font-mono text-3xl mt-1" style={{ color:C.ink }}>{r.top[0].i}–{r.top[0].j}</div>
        </div>
        <div className="text-center">
          <div className="text-xs" style={{ color:C.muted }}>Goles esperados</div>
          <div className="font-mono text-3xl mt-1" style={{ color:C.ink }}>{r.la.toFixed(1)}–{r.lb.toFixed(1)}</div>
        </div>
      </div>
      <div className="text-xs font-mono mb-1" style={{ color:C.muted }}>LÍNEAS (prob · cuota justa)</div>
      <LineRow label={"Gana " + a} p={r.pA} />
      <LineRow label="Empate" p={r.pD} />
      <LineRow label={"Gana " + b} p={r.pB} />
      <LineRow label="Más 1.5 goles" p={r.o15} />
      <LineRow label="Más 2.5 goles" p={r.o25} />
      <LineRow label="Más 3.5 goles" p={r.o35} />
      <LineRow label="Ambos marcan (BTTS)" p={r.btts} />
      <div className="mt-3 text-xs" style={{ color:C.muted }}>
        Otros marcadores: {r.top.map((c, k) => <span key={k} className="font-mono"> {c.i}–{c.j} ({pct(c.p)}%){k<3?" ·":""}</span>)}
      </div>
      <table className="w-full text-sm mt-4">
        <thead>
          <tr style={{ color:C.muted }} className="text-xs">
            <th className="text-left font-normal pb-2">Variable</th>
            <th className="text-right font-normal pb-2" style={{ color:C.A }}>{a}</th>
            <th className="text-right font-normal pb-2" style={{ color:C.B }}>{b}</th>
          </tr>
        </thead>
        <tbody className="font-mono">
          {rows.map((row, k) => (
            <tr key={k} style={{ borderTop:`1px solid ${C.line}`, color:k===rows.length-1?C.ink:C.muted }}>
              <td className="py-1.5" style={{ fontFamily:"system-ui" }}>{row[0]}</td>
              <td className="py-1.5 text-right">{row[1]}</td>
              <td className="py-1.5 text-right">{row[2]}</td>
            </tr>
          ))}
        </tbody>
      </table>
      <div className="mt-4 pt-3 text-sm" style={{ borderTop:`1px solid ${C.line}`, color:C.muted }}>
        Pick del modelo: <span style={{ color:C.ink, fontWeight:600 }}>{winner}</span>
        {(TEAMS[a].est || TEAMS[b].est) && <span className="text-xs"> · ⚠ datos estimados en alguna selección</span>}
      </div>
    </div>
  );
}

function Select({ label, value, onChange, opts, labels, accent }) {
  return (
    <div>
      <div className="text-xs mb-1" style={{ color:C.muted }}>{label}</div>
      <select value={value} onChange={(e) => onChange(e.target.value)}
        className="w-full px-3 py-2 rounded text-sm"
        style={{ background:C.bg, color:C.ink, border:`1px solid ${C.line}`, borderLeft:`2px solid ${accent}` }}>
        {opts.map((o, k) => <option key={k} value={o}>{labels ? labels[k] : o}</option>)}
      </select>
    </div>
  );
}

function App() {
  const [mode, setMode] = useState("match");
  const [a, setA] = useState("Colombia");
  const [b, setB] = useState("Uzbekistán");
  const [home, setHome] = useState("");
  const [venue, setVenue] = useState("CDMX · Azteca (2240m)");
  const [w, setW] = useState({ mv:1.0, league:0.6, form:1.0, goals:1.0, host:70, height:0.4, exp:0.4, alt:0.5, heat:0.3 });
  const allNames = useMemo(() => names.slice().sort(), []);
  const venueNames = useMemo(() => Object.keys(VENUES), []);
  const sliders = [
    { k:"mv", label:"Valor de plantilla", min:0, max:2, step:0.1 },
    { k:"league", label:"Militancia en ligas top", min:0, max:2, step:0.1 },
    { k:"form", label:"Forma reciente", min:0, max:2, step:0.1 },
    { k:"goals", label:"Tendencia de goles", min:0, max:2, step:0.1 },
    { k:"height", label:"Altura · balón parado", min:0, max:2, step:0.1 },
    { k:"exp", label:"Experiencia mundialista", min:0, max:2, step:0.1 },
    { k:"alt", label:"Altitud (sede)", min:0, max:2, step:0.1 },
    { k:"heat", label:"Calor (sede)", min:0, max:2, step:0.1 },
    { k:"host", label:"Localía (pts)", min:0, max:150, step:10 },
  ];

  return (
    <div className="min-h-screen p-4 sm:p-6" style={{ background:C.bg, color:C.ink, fontFamily:"system-ui, sans-serif" }}>
      <div className="max-w-3xl mx-auto">
        <header className="mb-6">
          <div className="text-xs font-mono mb-1" style={{ color:C.A }}>MODELO PROBABILÍSTICO · MUNDIAL 2026</div>
          <h1 className="text-2xl font-bold">Predictor de partidos</h1>
          <p className="text-sm mt-1" style={{ color:C.muted }}>
            Elo + valor + ligas + forma + altura + experiencia + contexto de sede (altitud y calor) → Poisson / Dixon-Coles.
          </p>
        </header>

        <div className="flex gap-2 mb-5">
          {[["match","Un partido"], ["all","Jornada 1 completa"]].map(([k, l]) => (
            <button key={k} onClick={() => setMode(k)} className="px-3 py-1.5 rounded text-sm transition"
              style={{ background:mode===k?C.A:"transparent", color:mode===k?C.bg:C.muted, border:`1px solid ${mode===k?C.A:C.line}`, fontWeight:mode===k?600:400 }}>
              {l}
            </button>
          ))}
        </div>

        <div className="p-4 rounded-lg mb-5" style={{ background:C.panel, border:`1px solid ${C.line}` }}>
          <div className="text-xs font-mono mb-3" style={{ color:C.muted }}>PESOS DEL MODELO · ajusta y todo se recalcula</div>
          <div className="grid grid-cols-1 sm:grid-cols-2 gap-x-6 gap-y-3">
            {sliders.map((s) => (
              <div key={s.k}>
                <div className="flex justify-between text-xs mb-1">
                  <span style={{ color:C.muted }}>{s.label}</span>
                  <span className="font-mono" style={{ color:C.ink }}>{w[s.k]}</span>
                </div>
                <input type="range" min={s.min} max={s.max} step={s.step} value={w[s.k]}
                  onChange={(e) => setW({ ...w, [s.k]: parseFloat(e.target.value) })} className="w-full" style={{ accentColor:C.A }} />
              </div>
            ))}
          </div>
        </div>

        {mode === "match" ? (
          <React.Fragment>
            <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-5">
              <Select label="Selección A" value={a} onChange={setA} opts={allNames} accent={C.A} />
              <Select label="Selección B" value={b} onChange={setB} opts={allNames} accent={C.B} />
              <Select label="Sede / contexto" value={venue} onChange={setVenue} opts={venueNames} accent={C.A} />
              <Select label="Localía" value={home} onChange={setHome} opts={["", a, b]} labels={["Neutral", a, b]} accent={C.muted} />
            </div>
            {a !== b
              ? <Detail a={a} b={b} w={w} home={home} venueName={venue} />
              : <div className="text-sm p-4" style={{ color:C.muted }}>Elige dos selecciones distintas.</div>}
            <div className="mt-4 text-xs font-mono" style={{ color:C.muted }}>ATAJOS JORNADA 1</div>
            <div className="flex flex-wrap gap-2 mt-2">
              {FIXTURES.map((fx, k) => (
                <button key={k} onClick={() => { setA(fx.a); setB(fx.b); setHome(fx.home || ""); setVenue(fx.venue || "Neutral"); }}
                  className="text-xs px-2 py-1 rounded" style={{ color:C.muted, border:`1px solid ${C.line}` }}>
                  {fx.a.slice(0,3).toUpperCase()}–{fx.b.slice(0,3).toUpperCase()}
                </button>
              ))}
            </div>
          </React.Fragment>
        ) : (
          <div className="space-y-5">
            {groups.map((g) => {
              const gf = FIXTURES.filter((f) => f.g === g);
              if (!gf.length) return null;
              return (
                <div key={g}>
                  <div className="text-xs font-mono mb-2" style={{ color:C.A }}>GRUPO {g}</div>
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    {gf.map((fx, k) => <MatchCard key={k} fx={fx} w={w} />)}
                  </div>
                </div>
              );
            })}
          </div>
        )}

        <footer className="mt-8 pt-4 text-xs leading-relaxed" style={{ borderTop:`1px solid ${C.line}`, color:C.muted }}>
          Contexto de sede: la altitud penaliza a equipos no aclimatados (CDMX 2240m, Guadalajara 1560m) y el calor a los de clima frío,
          salvo sedes con techo+AC (Dallas, Houston, Atlanta). Tolerancias y altura de varias selecciones son proxies estimados (⚠),
          con peso bajo por defecto porque aún no están calibrados contra histórico. El total de goles ahora varía por partido (ofensividad de ambos equipos + desnivel), así que las líneas Más/Menos ya no son planas. Cuotas "justas" = 1÷probabilidad.
        </footer>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
